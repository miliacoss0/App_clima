<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Ciudades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (cargando()) {
    <ion-spinner></ion-spinner>
  } @else if (error()) {
    <p class="ion-padding">No se pudieron cargar las ciudades. Intentalo de nuevo</p>
  } @else {
    <ion-searchbar placeholder="Buscar ciudad" (ionInput)="buscar($event)"></ion-searchbar>
    <ion-list>
      @for (ciudad of ciudadesFiltradas(); track ciudad.nombre) {
        <ion-item button (click)="seleccionar(ciudad)">
          <ion-label>
            <h2> {{ ciudad.nombre }}</h2>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
