<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Hoy</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="refrescar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (cargando()) {
    <ion-spinner></ion-spinner>
  } @else if (error()) {
    <p>No se pudo cargar el clima. Intentalo de nuevo.</p>
  } @else {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ ubicacion.ciudadActual().nombre }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        @if (clima(); as c) {
          <div class="icono-clima">
            <ion-icon [icon]="c.icono"></ion-icon>
            <p>{{ c.texto }}</p>
          </div>
        }
        <div class="temperatura">{{ temperatura() }} °C</div>
      </ion-card-content>
    </ion-card>
  }
</ion-content>

<ion-toast
  [isOpen]="toastAbierto()"
  [message]="toastMensaje()"
  [duration]="2000"
  (didDismiss)="toastAbierto.set(false)"
></ion-toast>
