<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title> Hoy </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (cargando()) {
    <ion-spinner></ion-spinner>
  } @else if (error()) {
    <p>No se pudo cargar el clima. Intentalo de nuevo.</p>
  } @else {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ ubicacion.ciudadActual().nombre}}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="temperatura">{{ temperatura() }} °C</div>
      </ion-card-content>
    </ion-card>
  }
</ion-content>
