<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Pronóstico · {{ ubicacion.ciudadActual().nombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (cargando()) {
    <ion-spinner></ion-spinner>
  } @else if (error()) {
    <p class="ion-padding">No se pudo cargar el pronóstico. Intentalo de nuevo.</p>
  } @else {
    <ion-list>
      @for (dia of dias(); track dia.fecha) {
        <ion-item>
          <ion-icon slot="start" [icon]="dia.clima.icono"></ion-icon>
          <ion-label>
            <h2>{{ formatearFecha(dia.fecha) }}</h2>
            <p>Máx {{ dia.max }} °C · Min {{ dia.min }} °C</p>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
